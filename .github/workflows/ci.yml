name: CI

# Nothing builds on a push: work lands directly on main, and the builds run at a
# tag (v*) or on demand. A manual run builds and tests every target but
# publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # The tag must name the crate version exactly (v0.1.0 <-> 0.1.0).
      - name: Check that the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo pkgid -p rom2dmd)
          crate="${crate##*[@#]}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $crate: update Cargo.toml, then re-tag"
            exit 1
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      # The library alone, with the file export, and the command line.
      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --workspace --all-targets -- -D warnings

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            macos_min: '11.0'
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            macos_min: '10.15'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --workspace

      # The board tests need ROM sets ($ROM2DMD_ROMS) and skip without them; the
      # x86_64 macOS binary is cross-built on an arm64 runner: not run here.
      - name: Run tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }} --workspace

      - name: Smoke test (--version)
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/rom2dmd --version

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir pkg
          cp target/${{ matrix.target }}/release/rom2dmd README.md LICENSE pkg/
          tar czf rom2dmd-${{ matrix.label }}.tar.gz -C pkg rom2dmd README.md LICENSE

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/rom2dmd.exe, README.md, LICENSE -DestinationPath rom2dmd-${{ matrix.label }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rom2dmd-${{ matrix.label }}
          path: rom2dmd-${{ matrix.label }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          pattern: rom2dmd-*
          path: ${{ runner.temp }}/artifacts

      # The notes always go through --notes-file (never `--notes -`, which
      # publishes a body made of a single "-").
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<'EOF'
          Extract the display animations of a pinball ROM set by emulating its display board.

          | system | archive |
          |---|---|
          | Linux x86_64 | `rom2dmd-linux-x86_64.tar.gz` |
          | Linux aarch64 | `rom2dmd-linux-aarch64.tar.gz` |
          | Windows x86_64 | `rom2dmd-windows-x86_64.zip` |
          | macOS Apple Silicon, 11 Big Sur or later | `rom2dmd-macos-arm64.tar.gz` |
          | macOS Intel, 10.15 Catalina or later | `rom2dmd-macos-x86_64.tar.gz` |

          The binaries are not signed. The library is on crates.io:
          https://crates.io/crates/rom2dmd. Usage and supported boards: see the README.
          Run it only on ROM sets you own; never redistribute what it extracts.
          EOF
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $prerelease --title "rom2dmd ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes" "$RUNNER_TEMP"/artifacts/*/*
          body=$(gh release view "$GITHUB_REF_NAME" --json body --jq '.body')
          if [ ${#body} -lt 100 ]; then
            echo "::error::release body is only ${#body} characters"
            exit 1
          fi

  # The library on crates.io: Trusted Publishing (OIDC), no stored token; the
  # crates-io environment waits for an approval.
  publish-crate:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable

      - name: Get a temporary crates.io token (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if cargo publish -p rom2dmd 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
            echo "published"
          elif grep -q "already exists" "$RUNNER_TEMP/publish.log"; then
            echo "this version is already on crates.io: nothing to do"
          else
            exit 1
          fi
