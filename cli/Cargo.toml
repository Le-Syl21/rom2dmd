[package]
name = "rom2dmd-cli"
version = "0.2.0"
edition = "2024"
description = "Command line of rom2dmd: extract a pinball ROM set's display animations to pictures, animations and a DMD dump"
license = "BSD-3-Clause"
repository = "https://github.com/Le-Syl21/rom2dmd"
publish = false

[[bin]]
name = "rom2dmd"
path = "src/main.rs"

[dependencies]
rom2dmd = { path = "..", features = ["export"] }
log = "0.4"
